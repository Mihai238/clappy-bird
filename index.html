<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#4ec0ca">
<title>Clappy Bird</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="/src/style.css">
</head>
<body>
<canvas id="game"></canvas>

<div id="menu" class="panel">
  <h1>Clappy Bird</h1>
  <p>Make a short, sharp sound to flap: a clap, a shouted "pah!" or a whistle. Each sound flaps once, so let it stop before the next.</p>
  <div class="row">
    <label for="micsens">Mic sensitivity</label>
    <input type="range" id="micsens" min="1" max="10" step="1">
  </div>
  <button id="start">Start</button>
  <div class="status" id="status"></div>
  <p>Lock screen rotation in portrait. Tap or Space also flaps.</p>
</div>

<div id="over" class="panel" hidden>
  <h2>Game over</h2>
  <div class="scores">
    <div><span>Score</span><strong id="final-score">0</strong></div>
    <div><span>Best</span><strong id="best-score">0</strong></div>
  </div>
  <div class="actions">
    <button id="again">Play again</button>
    <button id="settings" class="secondary">Mic settings</button>
  </div>
</div>

<script type="module" src="/src/main.ts"></script>
</body>
</html>
